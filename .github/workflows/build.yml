name: Build TOCO

on:
  push:
  workflow_dispatch:

# The release step needs write access to create a release and upload the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # These settings exist only for the on-device proot build and would
      # break or slow down CI: the JDK path does not exist on a runner.
      - name: Strip on-device tuning
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/org.gradle.workers.max/d' gradle.properties
          sed -i '/org.gradle.jvmargs/d' gradle.properties

      # The key is a repo secret, never committed. Without it the app still
      # builds; TOCO just reports that the AI is not configured.
      - name: Write local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> local.properties

      - run: chmod +x gradlew

      - run: ./gradlew assembleDebug --stacktrace

      # Still uploaded as an artifact, so old runs remain downloadable.
      - uses: actions/upload-artifact@v4
        with:
          name: toco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A rolling "latest" release, so there is one permanent link that always
      # points at the newest APK. Downloading never means digging through runs
      # or unzipping again: it is always
      #   github.com/<you>/toco/releases/latest
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest TOCO build
          body: >
            Automatically built from the newest commit.
            Install app-debug.apk below.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
