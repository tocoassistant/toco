name: Build TOCO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TOCO_KEYSTORE_PASSWORD: ${{ secrets.TOCO_KEYSTORE_PASSWORD }}
      TOCO_KEY_ALIAS: ${{ secrets.TOCO_KEY_ALIAS }}
      TOCO_KEY_PASSWORD: ${{ secrets.TOCO_KEY_PASSWORD }}
      TOCO_KEYSTORE_FILE: ${{ github.workspace }}/toco-release.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify required build secrets
        shell: bash
        run: |
          for name in GOOGLE_WEB_CLIENT_ID TOCO_KEYSTORE_PASSWORD TOCO_KEY_ALIAS TOCO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done
          if [ -z "${{ secrets.TOCO_KEYSTORE_BASE64 }}" ]; then
            echo "TOCO_KEYSTORE_BASE64 is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "Google OAuth and TOCO signing secrets are configured."

      - name: Restore TOCO signing keystore
        shell: bash
        env:
          TOCO_KEYSTORE_BASE64: ${{ secrets.TOCO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TOCO_KEYSTORE_BASE64" | base64 --decode > "$TOCO_KEYSTORE_FILE"
          test -s "$TOCO_KEYSTORE_FILE"

      - name: Verify TOCO signing certificate
        shell: bash
        run: |
          ACTUAL_SHA1="$(keytool -list -v -keystore "$TOCO_KEYSTORE_FILE" -alias "$TOCO_KEY_ALIAS" -storepass "$TOCO_KEYSTORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          EXPECTED_SHA1="02:38:D1:07:7A:91:FD:14:F1:9D:A0:FB:2F:05:7A:E2:DC:ED:80:38"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Signing certificate SHA-1 does not match the Google OAuth certificate."
            exit 1
          fi
          echo "TOCO signing certificate matches Google OAuth configuration."

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TOCO-beta-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$TOCO_KEYSTORE_FILE"
