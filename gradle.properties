# NOTE: org.gradle.jvmargs is deliberately ABSENT.
# Setting it makes Gradle fork a second JVM ("single-use Daemon"), and two JVMs
# inside a proot container is what was getting OOM-killed. Set the heap on the
# launcher instead:   export GRADLE_OPTS="-Xmx900m -XX:MaxMetaspaceSize=256m"

org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.java.home=/opt/java/jdk-17.0.20+8

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
