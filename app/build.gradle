plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Gemini key comes from local.properties, which is git-ignored so the key
// never reaches the repo. Absent key -> empty string -> TOCO reports that the
// AI is not configured instead of crashing.
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def geminiKey = localProps.getProperty("GEMINI_API_KEY", "")

android {
    namespace 'com.toco.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.toco.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "GEMINI_API_KEY", "\"" + geminiKey + "\""
    }

    // AGP 8 turns BuildConfig off by default; the Gemini key needs it.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
}
