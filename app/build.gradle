plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Gemini key comes from local.properties, which is git-ignored so the key
// never reaches the repo. Absent key -> empty string -> TOCO reports that the
// AI is not configured instead of crashing.
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def geminiKey = localProps.getProperty("GEMINI_API_KEY", "")

android {
    namespace 'com.toco.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.toco.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "GEMINI_API_KEY", "\"" + geminiKey + "\""
    }

    // AGP 8 turns BuildConfig off by default; the Gemini key needs it.
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // One fixed key for every build. Android treats two APKs as the "same
        // app" only if they share a signature, so signing every build with this
        // is what lets an update install over the old one WITHOUT wiping
        // permissions or the default-assistant choice. Without it, each CI
        // build was signed with a throwaway debug key and looked like a
        // different app, forcing a clean reinstall every time.
        toco {
            storeFile file("../toco-release.jks")
            storePassword "tocotoco"
            keyAlias "toco"
            keyPassword "tocotoco"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.toco
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.toco
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
}
