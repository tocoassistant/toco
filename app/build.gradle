plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// AI keys come from local.properties for local builds, or environment variables
// for CI/GitHub Actions builds. Secrets stay out of source control either way.
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def geminiKey = localProps.getProperty("GEMINI_API_KEY", System.getenv("GEMINI_API_KEY") ?: "")
def groqKey = localProps.getProperty("GROQ_API_KEY", System.getenv("GROQ_API_KEY") ?: "")
// Google OAuth client IDs are public identifiers, not secrets. CI/local overrides
// still win, but keeping the production Web client ID as a fallback prevents a
// perfectly valid APK from silently shipping with Google sign-in disabled.
def googleWebClientId = localProps.getProperty(
    "GOOGLE_WEB_CLIENT_ID",
    System.getenv("GOOGLE_WEB_CLIENT_ID") ?: "686211836517-p4thhoq74e4urfdutgeqsmv702f1trqd.apps.googleusercontent.com"
)

// Escape values before embedding them in generated BuildConfig.java.
def quoteForBuildConfig = { value ->
    def safe = (value ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${safe}\""
}

android {
    namespace 'com.toco.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.toco.ai"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "0.1.14-beta"

        buildConfigField "String", "GEMINI_API_KEY", quoteForBuildConfig(geminiKey)
        buildConfigField "String", "GROQ_API_KEY", quoteForBuildConfig(groqKey)
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", quoteForBuildConfig(googleWebClientId)
        buildConfigField "String", "SUPABASE_URL", quoteForBuildConfig("https://kgmxweluxummxzoqhniv.supabase.co")
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", quoteForBuildConfig("sb_publishable_1GzmPsDjPqDPQKzDiPL5WQ_6mlu2_oX")
    }

    // AGP 8 turns BuildConfig off by default; the Gemini key needs it.
    buildFeatures {
        buildConfig true
    }

    // CI supplies the permanent TOCO signing key through GitHub Actions secrets.
    // No keystore or password is committed to the repository.
    signingConfigs {
        tocoRelease {
            def keyFile = System.getenv("TOCO_KEYSTORE_FILE")
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv("TOCO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TOCO_KEY_ALIAS")
                keyPassword System.getenv("TOCO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.tocoRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
